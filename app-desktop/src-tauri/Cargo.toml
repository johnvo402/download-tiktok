[package]
name = "ai-video-localization"
version = "0.1.14-beta.1"
description = "JC AI desktop app"
authors = ["JC AI"]
edition = "2021"

[lib]
name = "ai_video_localization_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
async-trait = "0.1"
keyring = "4.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"
hound = "=3.5.1"
flate2 = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "metal", "wgsl"] }
raw-window-handle = "0.6"
pollster = "=0.4.0"
bytemuck = { version = "1.24", features = ["derive"] }
cosmic-text = "=0.18.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
[target.'cfg(windows)'.dependencies]
cpal = "=0.16.0"
windows = { version = "=0.58.0", features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation", "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_Security"
] }
