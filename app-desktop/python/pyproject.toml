[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-localization-worker"
version = "0.1.6"
description = "Local JSON Lines worker for JC AI desktop app"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1,<2",
    "playwright>=1.55,<2",
    "curl-cffi>=0.13,<1",
]

[project.optional-dependencies]
# Install only when local VieNeu-TTS is needed: `pip install -e .[tts]`.
# The SDK's default v3 Turbo CPU path is ONNX and does not require PyTorch.
tts = [
    "vieneu==3.8.3",
    "gradio==5.49.1",
]
# WhisperX adds PyTorch/TorchAudio/Transformers. Keep it opt-in so the default
# worker/install stays small; the Settings page detects whether the runtime is present.
whisperx = [
    "whisperx==3.8.6",
    "gradio==5.49.1",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
]
# Hard-subtitle OCR uses the mobile ONNX models. The package is opt-in for
# development; the release worker is built with this extra by the release lock.
ocr = ["rapidocr==3.9.2", "onnxruntime==1.30.0"]
# Optional NVIDIA CUDA provider for development machines. Default release builds
# remain CPU-first; CUDA release packaging needs a separately validated worker.
ocr-cuda = ["rapidocr==3.9.2", "onnxruntime-gpu==1.26.0"]
# Intel OCR shares ONNX weights; no CUDA or Torch dependency.
ocr-openvino = ["rapidocr==3.9.2", "onnxruntime==1.30.0", "openvino==2026.4.0", "openvino-telemetry==2025.2.0"]
whisper-openvino = ["openvino==2026.4.0", "openvino-genai==2026.4.0.0", "openvino-tokenizers==2026.4.0.0"]

# Optional, large runtime for cinematic dialogue/music/effects separation.
# Install CPU PyTorch first with scripts/setup-dialogue-dev.ps1.
dialogue = [
    "soundfile>=0.12,<1",
    "bandit-infer @ git+https://github.com/openmirlab/bandit-infer.git@7ec03cb568811958db65a96a10fdb8879922b2ac",
]

[tool.setuptools.package-data]
"worker.asr" = ["openvino-models.json"]

[tool.setuptools.packages.find]
include = ["worker*"]
exclude = ["tests*", "packaging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
