name: JC AI Windows CI and Release

on:
  push:
    branches: [dev]
    tags: ["v*", "desktop-v*"]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep this in sync with app-desktop/rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.98.1"
  PYTHON_VERSION: "3.12.10"

jobs:
  release-gate:
    name: Check tests for tagged commit
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      reuse-tests: ${{ steps.check.outputs.reuse-tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag commit
        run: echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check exact commit, branch and Windows test job
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { checkReleaseTests } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/app-desktop/scripts/ci-release-gate.mjs`));
            await checkReleaseTests({ github, context, core });

  test-windows:
    name: Test Windows x64
    needs: release-gate
    if: >-
      always() && !cancelled() &&
      (!startsWith(github.ref, 'refs/tags/') ||
       (needs.release-gate.result == 'success' && needs.release-gate.outputs.reuse-tests != 'true'))
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: app-desktop/package-lock.json
      # Unit tests use stdlib/fakes. A cold runner has no pip cache directory.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Cache Rust tests (separate from release)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-desktop/src-tauri -> target
          shared-key: windows-tests-v3
          cache-bin: false
      - name: Install frontend dependencies
        working-directory: app-desktop
        run: npm ci
      - name: Run frontend and release tooling tests
        working-directory: app-desktop
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ci
      - name: Check frontend production build
        working-directory: app-desktop
        run: npm run build
      - name: Prepare worker resource path for Rust tests
        run: New-Item -ItemType Directory -Force -Path app-desktop/src-tauri/resources/ai-worker, app-desktop/src-tauri/resources/downloader-worker | Out-Null
      - name: Run Rust tests
        run: cargo test --locked --manifest-path app-desktop/src-tauri/Cargo.toml --lib
      - name: Install model-free media fixture dependencies
        run: python -m pip install "av==18.1.0" "numpy==2.5.3" "packaging==26.3"
      - name: Run Python worker and cache tests
        working-directory: app-desktop
        run: |
          $env:PYTHONPATH = Join-Path $PWD "python"
          python -m unittest discover -s python/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts/tests -p "test_*.py" -v

  prepare-release-cache:
    name: Prepare changed release dependencies
    # Default-branch caches are visible to tags. PRs never populate them.
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Look up release dependencies without downloading them
        id: rust-lookup
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-desktop/src-tauri -> target
          shared-key: windows-package-v3
          cache-bin: false
          lookup-only: true
          save-if: false
      - name: Restore and save dependencies only on cache miss
        if: steps.rust-lookup.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-desktop/src-tauri -> target
          shared-key: windows-package-v3
          cache-bin: false
      - name: Prepare release dependencies with real Tauri build flags
        if: steps.rust-lookup.outputs.cache-hit != 'true'
        working-directory: app-desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path src-tauri/resources/ai-worker, src-tauri/resources/downloader-worker | Out-Null
          ./node_modules/.bin/tauri.cmd build --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fingerprint frozen worker inputs
        id: worker
        working-directory: app-desktop
        run: |
          $key = python scripts/worker-cache.py key --kind all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "key=worker-windows-x64-$key" >> $env:GITHUB_OUTPUT
      - name: Look up packaged worker without downloading it
        id: worker-lookup
        uses: actions/cache/restore@v4
        with:
          path: |
            app-desktop/src-tauri/resources/ai-worker
            app-desktop/src-tauri/resources/downloader-worker
          key: ${{ steps.worker.outputs.key }}
          lookup-only: true
      - name: Build changed worker
        if: steps.worker-lookup.outputs.cache-hit != 'true'
        working-directory: app-desktop
        run: ./scripts/build-worker.ps1 -Python python
      - name: Save packaged worker for subsequent tags
        if: steps.worker-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app-desktop/src-tauri/resources/ai-worker
            app-desktop/src-tauri/resources/downloader-worker
          key: ${{ steps.worker.outputs.key }}
      - name: Cache pinned FFmpeg download
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            app-desktop/.release-cache/ffmpeg-*.zip
            app-desktop/.release-cache/checksums.sha256
          key: ffmpeg-windows-x64-${{ hashFiles('app-desktop/scripts/build-ffmpeg.ps1') }}
      - name: Fetch verified FFmpeg archive on cache miss
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        working-directory: app-desktop
        run: ./scripts/build-ffmpeg.ps1 -DownloadOnly

  package-windows:
    name: Build Windows x64 installer
    needs: [release-gate, test-windows]
    if: >-
      always() && !cancelled() && startsWith(github.ref, 'refs/tags/') &&
      needs.release-gate.result == 'success' &&
      (needs.release-gate.outputs.reuse-tests == 'true' || needs.test-windows.result == 'success')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read release version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^(?:desktop-)?v(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Expected tag vX.Y.Z or desktop-vX.Y.Z, got '$tag'."
          }
          "AI_VIDEO_LOCALIZATION_VERSION=$($Matches.version)" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: app-desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Cache Rust release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-desktop/src-tauri -> target
          shared-key: windows-package-v3
          cache-bin: false
      - name: Fingerprint frozen worker inputs
        id: worker
        working-directory: app-desktop
        run: |
          $key = python scripts/worker-cache.py key --kind all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "key=worker-windows-x64-$key" >> $env:GITHUB_OUTPUT
      - name: Restore identical packaged worker
        uses: actions/cache@v4
        with:
          path: |
            app-desktop/src-tauri/resources/ai-worker
            app-desktop/src-tauri/resources/downloader-worker
          key: ${{ steps.worker.outputs.key }}
      - name: Cache pinned FFmpeg archive
        uses: actions/cache@v4
        with:
          path: |
            app-desktop/.release-cache/ffmpeg-*.zip
            app-desktop/.release-cache/checksums.sha256
          key: ffmpeg-windows-x64-${{ hashFiles('app-desktop/scripts/build-ffmpeg.ps1') }}
      - name: Build, bundle and record stage timings
        shell: pwsh
        working-directory: app-desktop
        run: ./scripts/build-release.ps1 -Python python -SkipTests -Compression zlib
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jc-ai-windows-release
          path: app-desktop/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    needs: package-windows
    if: always() && needs.package-windows.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jc-ai-windows-release
          path: app-desktop/release
      - name: Read release version from tag
        run: |
          tag="${GITHUB_REF_NAME#desktop-}"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: JC AI ${{ env.RELEASE_VERSION }}
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app-desktop/release/*
