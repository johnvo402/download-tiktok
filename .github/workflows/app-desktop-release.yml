name: JC AI Windows Release

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: app-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-windows:
    name: Test Windows x64
    runs-on: windows-2022
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: app-desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: app-desktop/python/requirements-release.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust test build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-desktop/src-tauri -> target
          shared-key: windows-release

      - name: Cache pinned FFmpeg archive
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            app-desktop/.release-cache/ffmpeg-n8.1.3-win64-gpl-8.1.zip
            app-desktop/.release-cache/checksums.sha256
          key: ffmpeg-windows-x64-${{ hashFiles('app-desktop/scripts/build-ffmpeg.ps1') }}

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: app-desktop
        run: npm ci

      - name: Run frontend tests
        shell: pwsh
        working-directory: app-desktop
        run: npm test

      - name: Prepare worker resource path for Rust tests
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path app-desktop/src-tauri/resources/ai-worker | Out-Null

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path app-desktop/src-tauri/Cargo.toml --lib

      - name: Run Python worker tests
        shell: pwsh
        working-directory: app-desktop
        run: |
          $env:PYTHONPATH = Join-Path $PWD "python"
          python -m unittest discover -s python/tests -v

      - name: Warm pip cache for release worker
        if: github.ref == 'refs/heads/dev' && steps.python.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: app-desktop
        run: python -m pip download --disable-pip-version-check --dest "$env:RUNNER_TEMP\jc-ai-release-wheels" -r python/requirements-release.txt

      - name: Warm pinned FFmpeg download cache
        if: github.ref == 'refs/heads/dev' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: app-desktop
        run: ./scripts/build-ffmpeg.ps1 -DownloadOnly

      - name: Build frontend for Rust release cache
        if: github.ref == 'refs/heads/dev'
        shell: pwsh
        working-directory: app-desktop
        run: npm run build

      - name: Warm optimized Rust release cache
        if: github.ref == 'refs/heads/dev'
        shell: pwsh
        run: cargo build --release --manifest-path app-desktop/src-tauri/Cargo.toml

  package-windows:
    name: Build Windows x64 installer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Read release version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^(?:desktop-)?v(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Expected tag vX.Y.Z or desktop-vX.Y.Z (optionally with a prerelease suffix), got '$tag'."
          }
          $tagVersion = $Matches.version
          "AI_VIDEO_LOCALIZATION_VERSION=$tagVersion" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$tagVersion" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: app-desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: app-desktop/python/requirements-release.txt

      - name: Set up optional runtime installer
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust release build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-desktop/src-tauri -> target
          shared-key: windows-release

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache pinned FFmpeg archive
        uses: actions/cache@v4
        with:
          path: |
            app-desktop/.release-cache/ffmpeg-n8.1.3-win64-gpl-8.1.zip
            app-desktop/.release-cache/checksums.sha256
          key: ffmpeg-windows-x64-${{ hashFiles('app-desktop/scripts/build-ffmpeg.ps1') }}

      - name: Build and package installer
        shell: pwsh
        working-directory: app-desktop
        run: ./scripts/build-release.ps1 -Python python -SkipTests

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jc-ai-windows-release
          path: app-desktop/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - test-windows
      - package-windows
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: jc-ai-windows-release
          path: app-desktop/release

      - name: Read release version from tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#desktop-}"
          version="${tag#v}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: JC AI ${{ env.RELEASE_VERSION }}
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app-desktop/release/*
